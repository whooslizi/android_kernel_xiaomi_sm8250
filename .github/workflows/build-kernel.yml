name: Build

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "KernelSU-Next ref (465490a2 = UAPI v5, matches manager v3.4.2)"
        required: false
        default: "465490a2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KSU_REF: ${{ inputs.ksu_ref || '465490a2' }}
      DEFCONFIGS: >-
        vendor/kona-perf_defconfig
        vendor/xiaomi/sm8250-common.config
        vendor/xiaomi/apollo.config
        vendor/xiaomi/ksu.config
      MAKE_ARGS: >-
        O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang
        CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate inputs
        run: |
          find_one() { find . -path ./out -prune -o -path ./.git -prune -o -type f -name "$1" -print | head -1; }
          PATCH=$(find_one 'apollo-ksun.patch')
          SWAP=$(find_one 'swapkernel.py')
          STOCK=$(find_one 'boot-stock.img.gz')
          [ -z "$STOCK" ] && STOCK=$(find_one 'boot-stock.img')
          echo "patch: ${PATCH:-MISSING}"; echo "swap:  ${SWAP:-MISSING}"; echo "stock: ${STOCK:-MISSING}"
          [ -n "$PATCH" ] && [ -n "$SWAP" ] && [ -n "$STOCK" ] || { echo "::error::missing input file(s), see above"; exit 1; }
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"
          echo "SWAP=$SWAP" >> "$GITHUB_ENV"
          echo "STOCK=$STOCK" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm bc bison flex cpio libssl-dev libelf-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Prepare stock boot.img
        run: |
          mkdir -p stock
          case "$STOCK" in
            *.gz) gunzip -c "$STOCK" > stock/boot-stock.img ;;
            *)    cp "$STOCK" stock/boot-stock.img ;;
          esac
          head -c 8 stock/boot-stock.img | grep -q 'ANDROID!' || { echo "::error::not a boot image"; exit 1; }
          ls -lh stock/boot-stock.img

      - name: Apply hooks patch
        run: git apply --verbose "$PATCH"

      - name: Add KernelSU-Next (legacy)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "$KSU_REF"
          git -C KernelSU-Next fetch --tags origin || true
          git -C KernelSU-Next checkout -q "$KSU_REF"
          UAPI=$(grep -oP 'define KERNEL_SU_UAPI_VERSION \K[0-9]+' KernelSU-Next/uapi/supercall.h || echo "?")
          echo "KSU-Next $(git -C KernelSU-Next rev-parse --short HEAD), UAPI v$UAPI"
          echo "KSU_SHORT=$(git -C KernelSU-Next rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "KSU_UAPI=$UAPI" >> "$GITHUB_ENV"

      - name: Add SUSFS
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          # SUS_MOUNT / SUS_KSTAT / TRY_UMOUNT hunks reject on this fs_context kernel.
          # They are disabled in ksu.config below and every applied hunk is #ifdef-guarded,
          # so a partial apply compiles cleanly. Rejects are expected; we drop them.
          patch -p1 --no-backup-if-mismatch < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          find . -name '*.rej' -delete
          echo "SUSFS version:"; grep -r 'SUSFS_VERSION' include/linux/susfs.h || true
          cat >> arch/arm64/configs/vendor/xiaomi/ksu.config <<'CFG'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          # CONFIG_KSU_SUSFS_SUS_MOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT is not set
          # CONFIG_KSU_SUSFS_TRY_UMOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set
          # CONFIG_KSU_SUSFS_SUS_KSTAT is not set
          CFG

      - name: Clean version string
        run: ': > .scmversion'

      - name: Configure
        run: |
          make $MAKE_ARGS $DEFCONFIGS
          grep -E '^CONFIG_KSU(_MANUAL_HOOK)?=y' out/.config
          grep -E '^CONFIG_KSU_SUSFS_(SUS_PATH|OPEN_REDIRECT|SPOOF_UNAME|SPOOF_CMDLINE_OR_BOOTCONFIG)=y' out/.config
          ! grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config || { echo "::error::SUS_MOUNT on, rejects matter"; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_ARGS 2>&1 | tee build.log
          grep -q "KernelSU-Next: Hook mode: Manual" build.log
          test -f out/arch/arm64/boot/Image

      - name: Make boot.img
        run: |
          python3 "$SWAP" stock/boot-stock.img out/arch/arm64/boot/Image boot-ksun.img
          TAG="apollo-ksun-${KSU_SHORT}-$(date +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sha256sum boot-ksun.img | tee boot-ksun.img.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            boot-ksun.img
            boot-ksun.img.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            KernelSU-Next `${{ env.KSU_SHORT }}` (UAPI v${{ env.KSU_UAPI }}), manual hooks.
            SUSFS ${{ env.SUSFS_VER }} (sus_path, open_redirect, spoof uname+cmdline).
